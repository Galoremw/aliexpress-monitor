<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AliExpress 竞品监控{% endblock %}</title>
    <link rel="stylesheet" href="/static/dashboard.css?v=601d2ce">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">AliExpress 竞品监控</a>
      <nav aria-label="主导航">
        <a href="/">监控台</a>
        <a href="/manual">人工处理</a>
        <a href="/docs">API 文档</a>
        <button id="logout" class="nav-logout" type="button">退出登录</button>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/dashboard.js?v=601d2ce" defer></script>
    <script>
      document.querySelector("#logout")?.addEventListener("click", async () => {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        location.href = "/login";
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
