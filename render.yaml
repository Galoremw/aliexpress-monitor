services:
  - type: web
    name: aliexpress-monitor-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aliexpress-monitor-db
          property: connectionString
      - key: TIMEZONE
        value: Asia/Shanghai
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: FIRECRAWL_ENABLED
        value: "true"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: AUTH_SESSION_TTL_HOURS
        value: "168"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false

  - type: web
    name: aliexpress-monitor-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: aliexpress-monitor-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
